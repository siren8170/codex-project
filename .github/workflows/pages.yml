# site/ 폴더의 랜딩 페이지를 GitHub Pages에 배포한다.
# 저장소 Settings > Pages > Source를 "GitHub Actions"로 바꿔야 동작한다.
name: Deploy landing page

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 진행 중인 배포는 끝까지 두고, 대기 중인 것만 최신으로 바꾼다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
